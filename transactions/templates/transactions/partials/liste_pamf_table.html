<div class="table-responsive">
    <table class="table table-sm table-striped">
        <thead>
            <tr><th>TRANSID</th><th>Date</th><th>rAutotransactionID</th><th>Heure</th><th>Note</th></tr>
        </thead>
        <tbody>
            {% for t in page_obj %}
            <tr>
                <td>{{ t.transid_mvola }}</td>
                <td>{{ t.posting_date }}</td>
                <td>{{ t.r_autotransaction_id }}</td>
                <td>{{ t.time }}</td>
                <td>{{ t.note|truncatechars:60 }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="5" class="text-muted-debian">Aucune transaction.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% include "_pagination.html" %}
